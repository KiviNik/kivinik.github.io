<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin="" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <script>
        // корды и масштаб
        const map = L.map('map').setView([55.751244, 37.618423], 11);

        map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank">Leaflet</a>');

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Загружаем данные (работает только через HTTP-сервер, не через file://)
        fetch("data.json")
          .then(r => r.json())
          .then(data => {
            data.features.forEach(feature => {
              const p = feature.properties;
              const [lng, lat] = feature.geometry.coordinates;

              // Формируем текст всплывающего окна
              const langs = Object.entries(p)
                .filter(([key, val]) =>
                  !["№","субъ1","субъ2","район","Н.п.","Всего","lat","lon"].includes(key)
                  && val && val > 0
                )
                .sort((a, b) => b[1] - a[1])          // сортируем по убыванию
                .slice(0, 5)                            // топ-5 языков
                .map(([lang, count]) => `<b>${lang}</b>: ${count}`)
                .join("<br>");

              const popup = `
                <strong>${p["Н.п."]}</strong><br>
                Население: ${p["Всего"]}<br><hr>
                Топ языки:<br>${langs}
              `;

              L.circleMarker([lat, lng], {
                radius: Math.max(4, Math.sqrt(p["Всего"]) / 5), // размер ~ население
                color: "#2563eb",
                fillColor: "#3b82f6",
                fillOpacity: 0.7,
                weight: 1
              })
              .addTo(map)
              .bindPopup(popup);
            });
          });
    </script>
    
</body>
</html>
